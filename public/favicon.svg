<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#0A0A0C"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#F59E0B" stroke-width="12" stroke-opacity="0.3"/>
  
  <!-- Outer Glow -->
  <circle cx="256" cy="270" r="180" fill="#F59E0B" opacity="0.12"/>
  
  <!-- Lid -->
  <rect x="180" y="70" width="152" height="44" rx="16" fill="#8B5E34" stroke="#1A0F07" stroke-width="10"/>
  <rect x="194" y="80" width="124" height="12" rx="4" fill="#D4A373" opacity="0.6"/>
  <rect x="196" y="114" width="120" height="20" rx="4" fill="#E2E8F0" stroke="#1A0F07" stroke-width="8" opacity="0.8"/>
  
  <!-- Glass Body -->
  <rect x="120" y="134" width="272" height="300" rx="64" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="14" stroke-opacity="0.8"/>
  
  <!-- Coins Fill -->
  <path d="M 134 260 Q 256 240 378 260 L 378 370 Q 378 420 328 420 L 184 420 Q 134 420 134 370 Z" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="6"/>
  
  <!-- Coin Stack Pattern -->
  <circle cx="190" cy="300" r="22" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
  <circle cx="256" cy="290" r="26" fill="#FDE047" stroke="#D97706" stroke-width="6"/>
  <circle cx="320" cy="310" r="22" fill="#FEF08A" stroke="#D97706" stroke-width="6"/>
  <circle cx="220" cy="350" r="24" fill="#FBBF24" stroke="#B45309" stroke-width="6"/>
  <circle cx="290" cy="355" r="24" fill="#FDE047" stroke="#B45309" stroke-width="6"/>
  
  <!-- Chibi Face Overlay -->
  <path d="M 200 210 Q 212 195 224 210" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
  <path d="M 288 210 Q 300 195 312 210" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
  <path d="M 240 226 Q 256 242 272 226" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Glass Reflection -->
  <rect x="148" y="160" width="20" height="200" rx="10" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Sparkles -->
  <polygon points="400,140 408,156 424,164 408,172 400,188 392,172 376,164 392,156" fill="#FDE047"/>
  <polygon points="100,280 105,290 115,295 105,300 100,310 95,300 85,295 95,290" fill="#FBBF24"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
</svg>